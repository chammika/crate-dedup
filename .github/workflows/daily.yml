name: daily

on:
  schedule:
    - cron: "30 3 * * *"  # crates.io publishes the dump around 02:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # report.json depends only on the dump and analyze.py. The dump's ETag changes only when
      # crates.io publishes a new one (daily), so reuse the cached report unless one of them changed.
      - name: Get dump version
        id: dump
        run: |
          etag=$(curl -sSfIL https://static.crates.io/db-dump.tar.gz | grep -i '^etag:' | tail -1 | cut -d' ' -f2 | tr -dc '[:alnum:]-')
          test -n "$etag"
          echo "etag=$etag" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: report
        with:
          path: site/report.json
          key: report-${{ steps.dump.outputs.etag }}-${{ hashFiles('analyze.py') }}

      - if: steps.report.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@v10.3.3  # no floating major tag published

      # Stream-extract only the CSVs analyze.py reads; the 2 GB tarball never touches disk.
      - name: Download crates.io dump
        if: steps.report.outputs.cache-hit != 'true'
        run: |
          mkdir dump
          curl -sSfL https://static.crates.io/db-dump.tar.gz | tar -xzf - -C dump --strip-components=2 --wildcards \
            '*/data/crates.csv' '*/data/crate_downloads.csv' '*/data/versions.csv' \
            '*/data/default_versions.csv' '*/data/dependencies.csv' '*/data/version_downloads.csv' \
            '*/data/crate_owners.csv' '*/data/users.csv' '*/data/teams.csv'
          ls -lh dump

      - if: steps.report.outputs.cache-hit != 'true'
        run: uv run analyze.py dump site/report.json

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
